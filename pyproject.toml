[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "bandsolver"
version = "0.1.1"
description = "Newman BAND block-tridiagonal solver with C++ and Fortran backends"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "John Bernard" }]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest", "nbformat", "nbclient", "ipykernel", "matplotlib"]
notebooks = ["jupyterlab", "matplotlib"]

[tool.scikit-build]
wheel.packages = ["python/bandsolver"]
# Never ship the private archival oracle, even if a copy is placed inside the tree.
sdist.exclude = ["legacy/", "bandsolver-legacy-oracle/", "build*/", ".venv/", "TRACK1_LOOP.md", "*.log", "dist/", ".github/", "ci/", "benchmarks/results/"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
BANDSOLVER_BUILD_TESTS = "OFF"
BANDSOLVER_BUILD_PYTHON = "ON"
BANDSOLVER_BUILD_EXAMPLES = "OFF"

[tool.cibuildwheel]
skip = ["*-musllinux_*"]
archs = ["native"]
build-verbosity = 1
test-requires = ["pytest"]
test-sources = ["tests", "examples", "README.md"]
test-command = "python -m pytest -q tests/python"

[tool.cibuildwheel.linux]
before-all = "sh ci/install_gfortran_manylinux.sh"

[tool.cibuildwheel.macos]
# Apple clang for C/C++ (no bundled libstdc++); gfortran only for Fortran.
environment = { CC = "clang", CXX = "clang++" }

[tool.cibuildwheel.windows]
environment = { CMAKE_GENERATOR = "Ninja", CC = "cl", CXX = "cl", FC = "ifx" }
repair-wheel-command = "python ci/repair_windows.py {dest_dir} {wheel}"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
