name: Wheels

on:
  push:
    tags: ['v*']
    branches: [ci]
  pull_request:
    paths: ['pyproject.toml', 'CMakeLists.txt', '**/CMakeLists.txt', '.github/workflows/wheels.yml', 'ci/**']
  workflow_dispatch:

jobs:
  wheels:
    name: wheels ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, os: ubuntu-24.04}
          - {name: linux-aarch64, os: ubuntu-24.04-arm}
          - {name: macos-arm64, os: macos-14, target: '14.0'}
          - {name: macos-x86_64, os: macos-15-intel, target: '15.0'}
          - {name: windows-amd64, os: windows-2025}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'macOS'
        uses: fortran-lang/setup-fortran@v1.10.0
        with: {compiler: gcc, version: 14}
      - if: runner.os == 'Windows'
        uses: fortran-lang/setup-fortran@v1.10.0
        with: {compiler: intel, version: '2025.3'}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.13'}
      - run: python -m pip install build && python -m build --sdist
      - uses: actions/upload-artifact@v7
        with: {name: sdist, path: dist/*.tar.gz}

  attach-to-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: {path: dist, merge-multiple: true}
      - name: Attach wheels and sdist to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "bandsolver ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --clobber
