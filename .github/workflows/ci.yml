name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.toolchain.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: {compiler: gcc, version: 14}
          - os: ubuntu-24.04-arm
            toolchain: {compiler: gcc, version: 14}
          - os: macos-14
            toolchain: {compiler: gcc, version: 14}
          - os: macos-15-intel
            toolchain: {compiler: gcc, version: 14}
          - os: windows-2025
            toolchain: {compiler: intel, version: '2025.3'}
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v1.10.0
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build tools
        run: python -m pip install cmake ninja
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export CC=clang CXX=clang++; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=${FC:-gfortran}
      - name: Configure (Windows, ifx + MSVC)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_Fortran_COMPILER=ifx
      - name: Build
        run: cmake --build build
      - name: Fortran / C / C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests (Unix; Windows is covered by the wheel workflow)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export CC=clang CXX=clang++; fi
          python -m pip install . pytest nbformat nbclient ipykernel matplotlib
          python -m pytest -q
